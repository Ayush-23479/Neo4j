services:
  backend:
    build: ./backend
    env_file: .env
    expose:
      - "8000"          # internal only, not published to the host
    volumes:
      - ./data:/app/data          # Relate store file lives here
      - ./graph:/app/graph:ro     # schema.cypher, read at startup
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"     # the only published port