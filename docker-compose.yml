services:
  backend:
    build: ./backend
    env_file: .env
    expose:
      - "8000"          # internal only, not published to the host
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"     # the only published port

  # Relate graph service — embedded mode; RELATE_PATH points to the mounted volume
  graph:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    profiles: ["server"]
    expose:
      - "7687"
    environment:
      - RELATE_PATH=/app/data/graph